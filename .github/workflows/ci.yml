name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Offline tests and demos (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Verify no install step needed
        run: node --version && npm --version

      - name: Run tests
        run: npm test

      - name: Run demo:support
        run: npm run demo:support

      - name: Run demo:planner
        run: npm run demo:planner

      - name: Run legacy demo (npm start)
        run: npm start

      - name: Build static public demo
        run: npm run build:demo

      - name: Scaffold a throwaway third app and re-run tests
        run: |
          npm run new-app ci-smoke-app "CI Smoke App"
          npm test
          git checkout -- apps/index.js && rm -rf apps/ci-smoke-app
